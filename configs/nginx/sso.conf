# sso.jomhoor.org — Jomhoor SSO service (OIDC provider for MAS + relying parties)
# civic-nginx is on the iranians-vote_default network, so container
# name 'sso-svc' resolves directly (sso-svc:8000).

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name sso.jomhoor.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name sso.jomhoor.org;

    ssl_certificate     /etc/letsencrypt/live/sso.jomhoor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.jomhoor.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSO_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Use Docker embedded DNS for runtime container name resolution
    resolver 127.0.0.11 valid=10s;

    location / {
        set $sso_upstream http://sso-svc:8000;
        proxy_pass $sso_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
