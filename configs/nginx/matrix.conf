# matrix.jomhoor.org — Synapse Matrix homeserver
# civic-nginx is on the iranians-vote_default network, so container
# names resolve directly (synapse:8008).

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name matrix.jomhoor.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name matrix.jomhoor.org;

    ssl_certificate     /etc/letsencrypt/live/matrix.jomhoor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.jomhoor.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MATRIX_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Use Docker embedded DNS for runtime container name resolution
    resolver 127.0.0.11 valid=10s;

    # Large uploads for media (matches Synapse max_upload_size: 50M)
    client_max_body_size 50M;

    # ── Matrix client/server well-known ────────────────────────────────────────
    # Tells clients the homeserver URL and that MAS handles auth.
    location /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.jomhoor.org"},"m.authentication":{"issuer":"https://mas.jomhoor.org/"}}';
    }

    # Tells remote servers our federation endpoint (disabled but clients may query)
    location /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.server":"matrix.jomhoor.org:443"}';
    }

    # ── Synapse Matrix API ─────────────────────────────────────────────────────
    location /_matrix/ {
        set $synapse_upstream http://synapse:8008;
        proxy_pass $synapse_upstream$request_uri;
        proxy_http_version 1.1;

        # WebSocket support (needed for /sync long-poll)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ── Synapse admin API ──────────────────────────────────────────────────────
    location /_synapse/ {
        set $synapse_upstream http://synapse:8008;
        proxy_pass $synapse_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Health check
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
# $connection_upgrade is defined in 00-maps.conf (loaded first alphabetically)
