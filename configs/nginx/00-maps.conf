# 00-maps.conf — Shared nginx map directives
# Loaded first (alphabetically) so all vhost confs can use these variables.
# This file is included inside the http {} block via conf.d/*.conf glob.

# WebSocket connection upgrade map.
# Used by matrix.jomhoor.org /_matrix/ proxy block to support sliding sync.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
