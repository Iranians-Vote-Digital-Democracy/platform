# matrix.jomhoor.org — Synapse homeserver
# Proxies to synapse container on the iranians-vote Docker network.
#
# Deployed to: /opt/iranians-vote/nginx/conf.d/matrix-jomhoor-org.conf
#
# Network setup:
#   The system nginx (or civic-nginx) must be able to reach the `synapse`
#   container at hostname `synapse` on the iranians-vote Docker network.
#   Synapse listens on port 8008 (plain HTTP, TLS terminated here).
#
# Federation is DISABLED (no port 8448, no srv DNS record needed).
#
# /.well-known/matrix/client tells Element which homeserver and OIDC provider
# (MAS) to use. Served inline so no separate file is needed.
#
# /.well-known/matrix/server tells other homeservers where to connect.
# Only relevant if federation is ever re-enabled; kept correct for completeness.

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name matrix.jomhoor.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name matrix.jomhoor.org;

    ssl_certificate     /etc/letsencrypt/live/matrix.jomhoor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.jomhoor.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Use Docker's embedded DNS so nginx resolves container names at request
    # time rather than startup (avoids "host not found" when containers are down).
    resolver 127.0.0.11 valid=30s;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Health check
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Client auto-discovery: tells Element/MAS-aware clients which homeserver
    # and OIDC provider to use.
    location /.well-known/matrix/client {
        add_header Content-Type application/json always;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.jomhoor.org"},"org.matrix.msc2965.authentication":{"issuer":"https://mas.jomhoor.org/","account":"https://mas.jomhoor.org/account"}}';
    }

    # Server auto-discovery: used by federation (disabled, but correct).
    location /.well-known/matrix/server {
        add_header Content-Type application/json always;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.server":"matrix.jomhoor.org:443"}';
    }

    # Matrix client-server and server-server API
    location /_matrix/ {
        set $upstream http://synapse:8008;
        proxy_pass $upstream/_matrix/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matrix file uploads can be large (default Synapse limit: 50 MB)
        client_max_body_size 60m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Synapse admin API — restrict to localhost / internal only.
    # The post-exchange Matrix hook in sso-svc calls this.
    location /_synapse/ {
        # Only reachable from within the Docker network; nginx enforces nothing
        # extra here because the container network is already isolated.
        set $upstream http://synapse:8008;
        proxy_pass $upstream/_synapse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
