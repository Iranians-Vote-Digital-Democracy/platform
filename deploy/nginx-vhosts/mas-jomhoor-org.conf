# mas.jomhoor.org — Matrix Authentication Service (MAS)
# Proxies to mas container on the iranians-vote Docker network.
#
# Deployed to: /opt/iranians-vote/nginx/conf.d/mas-jomhoor-org.conf
#
# Network setup:
#   The mas container must be reachable at hostname `mas` on the
#   iranians-vote Docker network. MAS listens on port 8080 (plain HTTP).
#
# MAS is the OIDC client that bridges Synapse to sso-svc.
# It renders its own UI during the brief redirect window (login spinner,
# consent pages for Matrix). Users see this host only momentarily.
#
# The MAS issuer URL (mas.jomhoor.org) must match exactly:
#   - MAS config: http.public_base = https://mas.jomhoor.org
#   - Synapse config: oidc_providers[].issuer = https://mas.jomhoor.org/
#   - sso_clients.redirect_uris contains:
#     https://mas.jomhoor.org/upstream/oauth2/callback/jomhoor-sso

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name mas.jomhoor.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name mas.jomhoor.org;

    ssl_certificate     /etc/letsencrypt/live/mas.jomhoor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mas.jomhoor.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Health check
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # All MAS routes: OIDC discovery, token endpoints, upstream OAuth2 callbacks,
    # account management UI, GraphQL API, etc.
    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
