# element.jomhoor.org — Element Web client
# Proxies to element-web container on the iranians-vote Docker network.
#
# Deployed to: /opt/iranians-vote/nginx/conf.d/element-jomhoor-org.conf
#
# Network setup:
#   The element-web container (vectorim/element-web) must be reachable at
#   hostname `element-web` on the iranians-vote Docker network.
#   It serves static files on port 80 inside the container.
#
# Element Web is entirely static — it is just files. nginx proxies to the
# upstream container so the config lives in one place rather than two.
#
# config.json is mounted into the container at /app/config.json and tells
# Element which homeserver to use. A minimal config:
#
#   {
#     "default_server_config": {
#       "m.homeserver": {
#         "base_url": "https://matrix.jomhoor.org",
#         "server_name": "jomhoor.org"
#       }
#     },
#     "disable_guests": true,
#     "brand": "Jomhoor"
#   }
#
# Element reads /.well-known/matrix/client from matrix.jomhoor.org at startup
# so it auto-discovers MAS as the OIDC provider without any extra config here.

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name element.jomhoor.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name element.jomhoor.org;

    ssl_certificate     /etc/letsencrypt/live/element.jomhoor.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/element.jomhoor.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Element Web needs to load resources from matrix.jomhoor.org and mas.jomhoor.org
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https://matrix.jomhoor.org https://mas.jomhoor.org wss://matrix.jomhoor.org; frame-src 'self' blob:; media-src 'self' blob: https:" always;

    # Aggressive caching for hashed static assets (JS/CSS bundles have content hashes in filename)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass http://element-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # index.html and config: never cache (Element checks for updates on load)
    location ~* \.(html|json)$ {
        proxy_pass http://element-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
    }

    # Everything else
    location / {
        proxy_pass http://element-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
